      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        working-directory: kernel-source
        run: |
          set -eo pipefail

          TC="${GITHUB_WORKSPACE}"
          PROCS="$(nproc --all)"

          # إلغاء معاملة التحذيرات كأخطاء وتجاوز أخطاء fortify-source
          KCFLAGS="-Wno-error -Wno-fortify-source -Wno-deprecated-declarations"
          HOSTCFLAGS="-Wno-error -Wno-deprecated-declarations"

          if [ "${COMPILER}" = "gcc" ]; then
            export PATH="${TC}/gcc32/bin:${TC}/gcc64/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-elf-
              CROSS_COMPILE_ARM32=arm-eabi-
              LD="${TC}/gcc64/bin/aarch64-elf-ld.lld"
              AR=llvm-ar
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              OBJCOPY=llvm-objcopy
              OBJSIZE=llvm-size
              STRIP=llvm-strip
              HOSTAR=llvm-ar
              HOSTCC=gcc
              HOSTCXX=aarch64-elf-g++
              CC=aarch64-elf-gcc
              WERROR=0
              KCFLAGS="${KCFLAGS}"
              HOSTCFLAGS="${HOSTCFLAGS}"
            )
          else
            export PATH="${TC}/proton-clang/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              LD=ld.lld
              AR=llvm-ar
              AS=llvm-as
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CC=clang
              WERROR=0
              KCFLAGS="${KCFLAGS}"
              HOSTCFLAGS="${HOSTCFLAGS}"
            )
          fi

          make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          if [ "${KSU_VARIANT}" != "none" ]; then
            echo "----- KernelSU related options in .config -----"
            grep -E "^CONFIG_(KSU|KPROBES)" out/.config || true
            grep -E "^CONFIG_KSU=y" out/.config \
              || { echo "ERROR: CONFIG_KSU is not enabled"; grep -i ksu out/.config; exit 1; }
            grep -E "^CONFIG_KPROBES=y" out/.config \
              || { echo "ERROR: CONFIG_KPROBES is not enabled"; grep -i kprobe out/.config; exit 1; }
          fi

          make -j"${PROCS}" "${MAKE_ARGS[@]}" Image dtbo.img 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

          DTB="out/arch/arm64/boot/dts/qcom/sm6150.dtb"
          if [ ! -f "${DTB}" ]; then
            make -j"${PROCS}" "${MAKE_ARGS[@]}" dtbs 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
          fi

          [ -f out/arch/arm64/boot/Image ] || { echo "ERROR: Image was not built"; exit 1; }
          [ -f out/arch/arm64/boot/dtbo.img ] || { echo "ERROR: dtbo.img was not built"; exit 1; }
          [ -f "${DTB}" ] || { echo "ERROR: ${DTB} was not built"; find out -name 'sm6150*.dtb'; exit 1; }
