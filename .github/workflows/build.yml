name: Build NetErnels (mojito/sunny) with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo"
        required: true
        default: "https://github.com/Neternels/android_kernel_xiaomi_sunny"
      kernel_branch:
        description: "Kernel branch (leave empty = repo default branch). Check the 'Show kernel branches' step to pick the newest one"
        required: false
        default: "LA.UM.9.1"
      defconfig:
        description: "Defconfig name"
        required: true
        default: "neternels_defconfig"
      compiler:
        description: "Compiler (if the build fails with one, try the other)"
        required: true
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      ksu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - next-legacy
          - official-v0.9.5
          - none
        default: next-legacy
      ksu_ref:
        description: "KernelSU-Next ref: 'legacy' = latest on the legacy (non-GKI) branch, or a tag/commit to pin"
        required: false
        default: "legacy"
      perf_module:
        description: "Also build a KernelSU/Magisk module with performance tweaks (separate zip)"
        required: false
        type: boolean
        default: true
      read_ahead_kb:
        description: "Module: read-ahead for internal storage in KB (0 = skip)"
        required: false
        default: "512"
      top_app_boost:
        description: "Module: schedtune boost for the foreground app (0 = skip, higher = smoother but more battery)"
        required: false
        default: "10"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      COMPILER: ${{ inputs.compiler }}
      KSU_VARIANT: ${{ inputs.ksu_variant }}
      KSU_REF: ${{ inputs.ksu_ref }}
      READ_AHEAD_KB: ${{ inputs.read_ahead_kb }}
      TOP_APP_BOOST: ${{ inputs.top_app_boost }}
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------
      - name: Show kernel branches (newest first)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REPO="${KERNEL_REPO#https://github.com/}"
          REPO="${REPO%.git}"
          echo "Branches of ${REPO}, newest commit first:"
          gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name' | while read -r b; do
            d="$(gh api "repos/${REPO}/commits/${b}" --jq '.commit.committer.date' 2>/dev/null)"
            echo "${d}  ${b}"
          done | sort -r | head -n 20
          exit 0

      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            perl \
            python-is-python3 \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip \
            zlib1g-dev

      # ------------------------------------------------------------
      - name: Check LLVM tools
        shell: bash
        run: |
          set -e
          for t in ar nm objdump objcopy strip as size; do
            if ! command -v "llvm-$t" >/dev/null 2>&1; then
              V="$(ls /usr/bin/llvm-$t-* 2>/dev/null | sort -V | tail -n1)"
              if [ -n "$V" ]; then
                sudo ln -sf "$V" "/usr/local/bin/llvm-$t"
                echo "linked llvm-$t -> $V"
              else
                echo "ERROR: llvm-$t not found"
                exit 1
              fi
            fi
          done
          echo "LLVM tools OK"

      # ------------------------------------------------------------
      - name: Clone kernel source (latest)
        shell: bash
        run: |
          set -e

          for i in 1 2 3; do
            if [ -n "${KERNEL_BRANCH}" ]; then
              git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel-source && break
            else
              git clone --depth=1 "${KERNEL_REPO}" kernel-source && break
            fi
            echo "Clone attempt $i failed, retrying..."
            rm -rf kernel-source
            sleep 10
          done

          [ -d kernel-source/.git ] || { echo "ERROR: could not clone ${KERNEL_REPO} (branch: ${KERNEL_BRANCH})"; exit 1; }

          cd kernel-source

          echo "Repo    : ${KERNEL_REPO}"
          echo "Branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit  : $(git log -1 --format='%h  %cd  %s' --date=short)"
          echo "Kernel  : $(make kernelversion 2>/dev/null || true)"

          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "ERROR: defconfig '${DEFCONFIG}' not found. Available configs:"
            ls arch/arm64/configs | head -n 60
            exit 1
          fi

      # ------------------------------------------------------------
      - name: Download toolchain
        shell: bash
        run: |
          set -e

          if [ "${COMPILER}" = "gcc" ]; then
            for p in "gcc-arm64:gcc64" "gcc-arm:gcc32"; do
              repo="${p%%:*}"
              dir="${p##*:}"
              curl -fsSL --retry 5 --retry-delay 5 \
                "https://github.com/cyberknight777/${repo}/archive/refs/heads/master.tar.gz" \
                | tar -xzf -
              mv "${repo}-master" "${dir}"
            done
            ./gcc64/bin/aarch64-elf-gcc --version | head -n1
          else
            curl -fsSL --retry 5 --retry-delay 5 -o proton.tar.gz \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
            tar -xzf proton.tar.gz
            mv proton-clang-master proton-clang
            ./proton-clang/bin/clang --version | head -n1
          fi

      # ------------------------------------------------------------
      - name: Integrate KernelSU
        if: ${{ inputs.ksu_variant != 'none' }}
        shell: bash
        working-directory: kernel-source
        run: |
          set -eo pipefail

          if [ "${KSU_VARIANT}" = "next-legacy" ]; then
            # KernelSU-Next: the actively maintained fork that still supports non-GKI (4.14) kernels
            SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
            SETUP_ARG="${KSU_REF:-legacy}"
          else
            # Official KernelSU: v0.9.5 is the last release that supports non-GKI kernels
            SETUP_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
            SETUP_ARG="v0.9.5"
          fi

          echo "KernelSU variant: ${KSU_VARIANT}  (ref: ${SETUP_ARG})"
          curl -fLSs "${SETUP_URL}" | bash -s "${SETUP_ARG}"

          # Make sure the hook-up really happened (folder name differs between variants)
          if [ ! -e drivers/kernelsu ] && ! ls -d KernelSU* >/dev/null 2>&1; then
            echo "ERROR: KernelSU was not added to the kernel tree"
            exit 1
          fi
          grep -qi kernelsu drivers/Makefile || { echo "ERROR: drivers/Makefile was not patched"; exit 1; }
          grep -qi kernelsu drivers/Kconfig  || { echo "ERROR: drivers/Kconfig was not patched"; exit 1; }

          for d in KernelSU KernelSU-Next; do
            if [ -d "$d" ]; then
              echo "Integrated ${d}: $(git -C "$d" log -1 --format='%h  %cd  %s' --date=short 2>/dev/null)"
            fi
          done

          # Kprobe based hooks (works on kernels with working kprobes)
          ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS

          grep -E "CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=" "arch/arm64/configs/${DEFCONFIG}"

      # ------------------------------------------------------------
      - name: Clang workaround - 32-bit vDSO assembler
        if: ${{ inputs.compiler == 'clang' }}
        shell: bash
        working-directory: kernel-source
        run: |
          set -e

          # Known issue with 4.14 kernels + newer clang:
          #   proton-clang/bin/as: unrecognized option '-EL'
          # clang looks for a plain "as" inside the toolchain dir and finds the x86 one.
          # Upstream fix: arm64: vdso32: Fix '--prefix=' value for newer versions of clang.
          MK=arch/arm64/kernel/vdso32/Makefile

          cat > /tmp/patch_vdso32.py <<'PY_EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          m = re.search(r'which \$\((CROSS_COMPILE_[A-Z0-9_]+)\)elfedit', s)
          old = '--prefix=$(COMPAT_GCC_TOOLCHAIN_DIR)'
          if not m or old not in s:
              print('pattern not found'); sys.exit(3)
          if old + '$(notdir' in s:
              print('already patched'); sys.exit(0)
          var = m.group(1)
          s = s.replace(old, old + '$(notdir $(' + var + '))')
          open(p, 'w').write(s)
          print('patched using', var)
          PY_EOF

          FIX="disable"
          if [ -f "$MK" ] && python3 /tmp/patch_vdso32.py "$MK"; then
            FIX="patch"
            grep -n -- "--prefix=" "$MK"
          fi

          if [ "$FIX" = "disable" ]; then
            echo "Could not patch the vdso32 Makefile - disabling the 32-bit vDSO instead"
            echo "vDSO related symbols in arch/arm64/Kconfig:"
            grep -n "VDSO" arch/arm64/Kconfig || true
            if grep -q "COMPAT_VDSO" arch/arm64/Kconfig; then
              ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -d COMPAT_VDSO
              grep -n "COMPAT_VDSO" "arch/arm64/configs/${DEFCONFIG}" || true
            else
              echo "WARNING: COMPAT_VDSO symbol not found - the 32-bit vDSO may still fail with clang."
            fi
          fi

          echo "VDSO32_FIX=${FIX}" >> "$GITHUB_ENV"
          echo "vDSO32 fix mode: ${FIX}"

      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        working-directory: kernel-source
        run: |
          set -eo pipefail

          TC="${GITHUB_WORKSPACE}"
          PROCS="$(nproc --all)"

          if [ "${COMPILER}" = "gcc" ]; then
            export PATH="${TC}/gcc32/bin:${TC}/gcc64/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-elf-
              CROSS_COMPILE_ARM32=arm-eabi-
              LD="${TC}/gcc64/bin/aarch64-elf-ld.lld"
              AR=llvm-ar
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              OBJCOPY=llvm-objcopy
              OBJSIZE=llvm-size
              STRIP=llvm-strip
              HOSTAR=llvm-ar
              HOSTCC=gcc
              HOSTCXX=aarch64-elf-g++
              CC=aarch64-elf-gcc
            )
          else
            export PATH="${TC}/proton-clang/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
              LD=ld.lld
              AR=llvm-ar
              AS=llvm-as
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CC=clang
            )
          fi

          make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}" 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

          if [ "${COMPILER}" = "clang" ]; then
            echo "----- vDSO options in .config (fix mode: ${VDSO32_FIX}) -----"
            grep -n "VDSO" out/.config || true
            if [ "${VDSO32_FIX}" = "disable" ] && grep -q "^CONFIG_COMPAT_VDSO=y" out/.config; then
              echo "ERROR: CONFIG_COMPAT_VDSO is still enabled - Proton Clang cannot build the 32-bit vDSO. Use compiler=gcc."
              exit 1
            fi
          fi

          if [ "${KSU_VARIANT}" != "none" ]; then
            echo "----- KernelSU related options in .config -----"
            grep -E "^CONFIG_(KSU|KPROBES)" out/.config || true
            grep -E "^CONFIG_KSU=y" out/.config \
              || { echo "ERROR: CONFIG_KSU is not enabled"; grep -i ksu out/.config; exit 1; }
            grep -E "^CONFIG_KPROBES=y" out/.config \
              || { echo "ERROR: CONFIG_KPROBES is not enabled"; grep -i kprobe out/.config; exit 1; }
          fi

          # Same targets the NetErnels maintainer uses (Image + dtbo.img)
          if ! make -j"${PROCS}" "${MAKE_ARGS[@]}" Image dtbo.img 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"; then
            set +e
            echo "=============================================================="
            echo " BUILD FAILED - re-running single-threaded to show the real error"
            echo "=============================================================="
            make -j1 "${MAKE_ARGS[@]}" Image dtbo.img > "${GITHUB_WORKSPACE}/rerun.log" 2>&1
            cat "${GITHUB_WORKSPACE}/rerun.log" >> "${GITHUB_WORKSPACE}/build.log"

            echo "----- first error with surrounding lines -----"
            grep -n -m1 -B12 -A12 -E "error:|\*\*\* \[|Error [0-9]+$" "${GITHUB_WORKSPACE}/rerun.log"

            echo "----- all error lines -----"
            grep -nE "error:|\*\*\* \[|multiple definition|undefined reference|No such file" "${GITHUB_WORKSPACE}/rerun.log" | head -n 30
            exit 1
          fi

          DTB="out/arch/arm64/boot/dts/qcom/sm6150.dtb"
          if [ ! -f "${DTB}" ]; then
            make -j"${PROCS}" "${MAKE_ARGS[@]}" dtbs 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
          fi

          [ -f out/arch/arm64/boot/Image ] || { echo "ERROR: Image was not built"; exit 1; }
          [ -f out/arch/arm64/boot/dtbo.img ] || { echo "ERROR: dtbo.img was not built"; exit 1; }
          [ -f "${DTB}" ] || { echo "ERROR: ${DTB} was not built"; find out -name 'sm6150*.dtb'; exit 1; }

      # ------------------------------------------------------------
      - name: Package (AnyKernel3)
        shell: bash
        run: |
          set -e

          KOUT="${GITHUB_WORKSPACE}/kernel-source/out/arch/arm64/boot"

          # NetErnels' own AnyKernel3 (device-specific), same as the maintainer's kramel.sh
          git clone --depth=1 -b mojito https://github.com/neternels/anykernel3 anykernel3-mojito

          mkdir -p anykernel3-mojito/dtbs
          cp "${KOUT}/Image" anykernel3-mojito/
          cp "${KOUT}/dtbo.img" anykernel3-mojito/
          cat "${KOUT}/dts/qcom/sm6150.dtb" > anykernel3-mojito/dtb

          TAG=""
          case "${KSU_VARIANT}" in
            next-legacy)     TAG="-KSUNext" ;;
            official-v0.9.5) TAG="-KSU" ;;
          esac
          ZIP="NetErnels-mojito${TAG}-$(date +%Y%m%d)-${KERNEL_COMMIT}.zip"

          cd anykernel3-mojito
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP}" . -x ".git*" -x "README.md" -x "LICENSE" -x "*.zip"

          cd "${GITHUB_WORKSPACE}"
          ls -lh "${ZIP}"
          sha1sum "${ZIP}"

      # ------------------------------------------------------------
      - name: Build performance module (KernelSU / Magisk)
        if: ${{ inputs.perf_module }}
        shell: bash
        run: |
          set -e

          case "${READ_AHEAD_KB}" in ''|*[!0-9]*) echo "ERROR: read_ahead_kb must be a number"; exit 1 ;; esac
          case "${TOP_APP_BOOST}" in ''|*[!0-9]*) echo "ERROR: top_app_boost must be a number"; exit 1 ;; esac

          mkdir -p perf-module

          cat > perf-module/module.prop <<PROP_EOF
          id=mojito_perf_tweaks
          name=Mojito Perf Tweaks
          version=v$(date +%Y%m%d)
          versionCode=$(date +%Y%m%d)
          author=Abdalla
          description=Runtime tweaks for Redmi Note 10 (mojito/sunny): storage read-ahead, CPU governor, foreground boost.
          PROP_EOF

          cat > perf-module/service.sh <<'SERVICE_EOF'
          #!/system/bin/sh
          # Mojito perf tweaks - runs in late_start service mode (KernelSU / Magisk)

          READ_AHEAD=@READ_AHEAD@
          TOP_APP_BOOST=@TOP_APP_BOOST@
          LOG=/data/local/tmp/mojito_perf.log

          # wait until Android finished booting, then let everything settle
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 2
          done
          sleep 20

          echo "=== mojito perf tweaks: $(date) ===" > "$LOG"

          # write helper: only touches files that exist and are writable
          w() {
            if [ -w "$1" ]; then
              if echo "$2" > "$1" 2>/dev/null; then
                echo "ok   $1 = $2" >> "$LOG"
              else
                echo "fail $1 = $2" >> "$LOG"
              fi
            else
              echo "skip $1 (missing)" >> "$LOG"
            fi
          }

          # 1) storage read-ahead (internal devices only, never USB drives)
          if [ "$READ_AHEAD" -gt 0 ]; then
            for dev in /sys/block/*; do
              name="${dev##*/}"
              case "$name" in
                loop*|ram*|zram*) continue ;;
              esac
              case "$(readlink -f "$dev" 2>/dev/null)" in
                *usb*) continue ;;
              esac
              w "$dev/queue/read_ahead_kb" "$READ_AHEAD"
            done
          fi

          # 2) CPU governor: schedutil on both clusters (little = cpu0, big = cpu6), if the kernel offers it
          for c in 0 6; do
            p="/sys/devices/system/cpu/cpu$c/cpufreq"
            if grep -qw schedutil "$p/scaling_available_governors" 2>/dev/null; then
              w "$p/scaling_governor" schedutil
            else
              echo "skip cpu$c: schedutil not available" >> "$LOG"
            fi
          done

          # 3) foreground app responsiveness
          if [ "$TOP_APP_BOOST" -gt 0 ]; then
            w /dev/stune/top-app/schedtune.boost "$TOP_APP_BOOST"
            w /dev/stune/top-app/schedtune.prefer_idle 1
          fi

          echo "done" >> "$LOG"
          SERVICE_EOF

          sed -i "s|@READ_AHEAD@|${READ_AHEAD_KB}|; s|@TOP_APP_BOOST@|${TOP_APP_BOOST}|" perf-module/service.sh
          chmod 755 perf-module/service.sh

          (cd perf-module && zip -r9 "${GITHUB_WORKSPACE}/Mojito-Perf-Tweaks.zip" .)
          ls -lh Mojito-Perf-Tweaks.zip

      # ------------------------------------------------------------
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: NetErnels-mojito-KSU
          if-no-files-found: error
          path: NetErnels-mojito*.zip

      - name: Upload performance module
        if: ${{ inputs.perf_module }}
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-Perf-Tweaks-Module
          if-no-files-found: error
          path: Mojito-Perf-Tweaks.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          if-no-files-found: ignore
          path: build.log
