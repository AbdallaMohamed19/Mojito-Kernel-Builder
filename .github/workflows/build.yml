name: Build NetErnels (mojito/sunny) with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo"
        required: true
        default: "https://github.com/Neternels/android_kernel_xiaomi_sunny"
      kernel_branch:
        description: "Kernel branch (empty = repo default). See the 'Show kernel branches' step"
        required: false
        default: "LA.UM.9.1"
      defconfig:
        description: "Defconfig name"
        required: true
        default: "neternels_defconfig"
      runner:
        description: "Runner OS (ubuntu-24.04 recommended; 22.04 has a real python2 but an older glibc)"
        required: true
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
        default: ubuntu-24.04
      compiler:
        description: "Compiler (if the build fails with one, try the other)"
        required: true
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      ksu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - next-legacy
          - official-v0.9.5
          - none
        default: next-legacy
      ksu_ref:
        description: "KernelSU-Next ref: 'legacy' = latest on the legacy (non-GKI) branch, or a tag/commit"
        required: false
        default: "legacy"

jobs:
  build:
    name: Build Kernel
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      COMPILER: ${{ inputs.compiler }}
      KSU_VARIANT: ${{ inputs.ksu_variant }}
      KSU_REF: ${{ inputs.ksu_ref }}
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------
      - name: Show kernel branches
        continue-on-error: true
        shell: bash
        run: |
          git ls-remote --heads "${KERNEL_REPO}" | sed 's|.*refs/heads/||' | head -n 40

      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            git libelf-dev libncurses-dev libssl-dev lld llvm lz4 make perl \
            python-is-python3 python3 unzip wget xz-utils zip zlib1g-dev

          sudo apt-get install -y python2 || true
          if ! command -v python2 >/dev/null 2>&1; then
            echo "python2 package not available - linking python3 as python2"
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python2
          fi
          python2 --version

      # ------------------------------------------------------------
      - name: Check LLVM tools
        shell: bash
        run: |
          set -e
          for t in ar nm objdump objcopy strip as size; do
            if ! command -v "llvm-$t" >/dev/null 2>&1; then
              V="$(ls /usr/bin/llvm-$t-* 2>/dev/null | sort -V | tail -n1)"
              [ -n "$V" ] || { echo "ERROR: llvm-$t not found"; exit 1; }
              sudo ln -sf "$V" "/usr/local/bin/llvm-$t"
              echo "linked llvm-$t -> $V"
            fi
          done
          if ! command -v ld.lld >/dev/null 2>&1; then
            V="$(ls /usr/bin/ld.lld-* 2>/dev/null | sort -V | tail -n1)"
            [ -n "$V" ] || { echo "ERROR: ld.lld not found"; exit 1; }
            sudo ln -sf "$V" /usr/local/bin/ld.lld
            echo "linked ld.lld -> $V"
          fi
          ld.lld --version | head -n1

      # ------------------------------------------------------------
      - name: Clone kernel source (latest)
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if [ -n "${KERNEL_BRANCH}" ]; then
              git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel-source && break
            else
              git clone --depth=1 "${KERNEL_REPO}" kernel-source && break
            fi
            echo "Clone attempt $i failed, retrying..."
            rm -rf kernel-source
            sleep 10
          done
          [ -d kernel-source/.git ] || { echo "ERROR: could not clone ${KERNEL_REPO} (branch: ${KERNEL_BRANCH})"; exit 1; }

          cd kernel-source
          echo "Repo    : ${KERNEL_REPO}"
          echo "Branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit  : $(git log -1 --format='%h  %cd  %s' --date=short)"
          echo "Kernel  : $(make kernelversion 2>/dev/null || true)"
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "ERROR: defconfig '${DEFCONFIG}' not found. Available configs:"
            ls arch/arm64/configs | head -n 60
            exit 1
          fi

      # ------------------------------------------------------------
      - name: Download toolchain
        shell: bash
        run: |
          set -e
          clone_tc() {
            local i
            for i in 1 2 3; do
              rm -rf "$2"
              git clone --depth=1 "$1" "$2" && return 0
              echo "Clone of $1 failed (attempt $i), retrying..."
              sleep 10
            done
            echo "ERROR: could not clone $1"
            return 1
          }

          if [ "${COMPILER}" = "gcc" ]; then
            clone_tc https://github.com/cyberknight777/gcc-arm64 gcc64
            clone_tc https://github.com/cyberknight777/gcc-arm gcc32
            ./gcc64/bin/aarch64-elf-gcc --version | head -n1 \
              || echo "WARNING: aarch64-elf-gcc cannot run here (GLIBC?) - try runner=ubuntu-24.04"
          else
            curl -fsSL --retry 5 --retry-delay 5 -o proton.tar.gz \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
            tar -xzf proton.tar.gz
            mv proton-clang-master proton-clang
            rm -f proton.tar.gz
            ./proton-clang/bin/clang --version | head -n1
          fi

      # ------------------------------------------------------------
      - name: Integrate KernelSU
        if: ${{ inputs.ksu_variant != 'none' }}
        shell: bash
        working-directory: kernel-source
        run: |
          set -eo pipefail

          if [ "${KSU_VARIANT}" = "next-legacy" ]; then
            SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
            SETUP_ARG="${KSU_REF:-legacy}"
          else
            SETUP_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
            SETUP_ARG="v0.9.5"
          fi

          echo "KernelSU variant: ${KSU_VARIANT}  (ref: ${SETUP_ARG})"
          curl -fLSs --retry 5 --retry-delay 5 -o /tmp/ksu_setup.sh "${SETUP_URL}"
          bash /tmp/ksu_setup.sh "${SETUP_ARG}"

          if [ ! -e drivers/kernelsu ] && ! ls -d KernelSU* >/dev/null 2>&1; then
            echo "ERROR: KernelSU was not added to the kernel tree"
            exit 1
          fi
          grep -qi kernelsu drivers/Makefile || { echo "ERROR: drivers/Makefile was not patched"; exit 1; }
          grep -qi kernelsu drivers/Kconfig  || { echo "ERROR: drivers/Kconfig was not patched"; exit 1; }

          # Kprobe based hooks (works on kernels with working kprobes)
          ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          grep -E "CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=" "arch/arm64/configs/${DEFCONFIG}"

      # ------------------------------------------------------------
      - name: Fix dtbo tool (python2 on new runners)
        shell: bash
        working-directory: kernel-source
        run: |
          set -e
          # dtbo.img uses an old python2 script; ubuntu-24.04 has no python2 (it becomes python3 -> 'xrange' error)
          PYV="$(python2 --version 2>&1 || true)"
          echo "python2 -> ${PYV}"
          case "${PYV}" in "Python 2."*) echo "real Python 2, nothing to patch"; exit 0 ;; esac

          for f in $(find . -name mkdtboimg.py -not -path './out/*'); do
            sed -i -E 's/\bxrange\(/range(/g; s/\bversion is 0\b/version == 0/g; s/\.tostring\(\)/.tobytes()/g' "$f"
            echo "patched $f"
          done

          # quick self-test of the patched tool
          printf '/dts-v1/;\n/plugin/;\n/ { };\n' > /tmp/t.dts
          dtc -@ -I dts -O dtb -o /tmp/t.dtbo /tmp/t.dts
          if ! python2 scripts/dtc/libfdt/mkdtboimg.py create /tmp/t.img --page_size=4096 /tmp/t.dtbo > /tmp/t.out 2>&1; then
            cat /tmp/t.out
            if grep -q Traceback /tmp/t.out; then
              echo "ERROR: dtbo tool still fails under Python 3. Re-run with runner=ubuntu-22.04 (it has a real python2)."
              exit 1
            fi
            echo "WARNING: self-test failed without a Python error (probably just different CLI options) - continuing"
          fi

      # ------------------------------------------------------------
      - name: Clang workaround - 32-bit vDSO assembler
        if: ${{ inputs.compiler == 'clang' }}
        shell: bash
        working-directory: kernel-source
        run: |
          set -e
          # 4.14 + newer clang: "proton-clang/bin/as: unrecognized option '-EL'" (clang picks the x86 "as").
          # Upstream fix: arm64: vdso32: Fix '--prefix=' value for newer versions of clang.
          MK=arch/arm64/kernel/vdso32/Makefile

          cat > /tmp/patch_vdso32.py <<'PY_EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          m = re.search(r'which \$\((CROSS_COMPILE_[A-Z0-9_]+)\)elfedit', s)
          old = '--prefix=$(COMPAT_GCC_TOOLCHAIN_DIR)'
          if not m or old not in s:
              print('pattern not found'); sys.exit(3)
          if old + '$(notdir' in s:
              print('already patched'); sys.exit(0)
          s = s.replace(old, old + '$(notdir $(' + m.group(1) + '))')
          open(p, 'w').write(s)
          print('patched using', m.group(1))
          PY_EOF

          FIX="disable"
          if [ -f "$MK" ] && python3 /tmp/patch_vdso32.py "$MK"; then
            FIX="patch"
            grep -n -- "--prefix=" "$MK"
          fi

          if [ "$FIX" = "disable" ]; then
            echo "Could not patch the vdso32 Makefile - disabling the 32-bit vDSO instead"
            if grep -q "COMPAT_VDSO" arch/arm64/Kconfig; then
              ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -d COMPAT_VDSO
            else
              echo "WARNING: COMPAT_VDSO symbol not found"
            fi
          fi

          echo "VDSO32_FIX=${FIX}" >> "$GITHUB_ENV"
          echo "vDSO32 fix mode: ${FIX}"

      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        working-directory: kernel-source
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -eo pipefail

          TC="${GITHUB_WORKSPACE}"
          PROCS="$(nproc --all)"

          if [ "${COMPILER}" = "gcc" ]; then
            export PATH="${TC}/gcc32/bin:${TC}/gcc64/bin:/usr/bin:${PATH}"

            # The toolchain's llvm-ar / llvm-objcopy / ld.lld may need glibc 2.36, but ubuntu-22.04 has
            # 2.35 ("llvm-ar: version GLIBC_2.36 not found"). For every tool use the first copy that runs.
            pick_tool() {
              local c
              for c in "$(command -v "$1" 2>/dev/null)" "/usr/local/bin/$1" "/usr/bin/$1" $(ls /usr/bin/$1-* 2>/dev/null | sort -V -r); do
                if [ -n "$c" ] && [ -x "$c" ] && "$c" --version >/dev/null 2>&1; then echo "$c"; return 0; fi
              done
              echo "ERROR: no working $1 found" >&2
              return 1
            }

            if ! aarch64-elf-gcc --version >/dev/null 2>&1; then
              echo "ERROR: aarch64-elf-gcc cannot run on this runner (GLIBC?). Re-run with runner=ubuntu-24.04."
              aarch64-elf-gcc --version || true
              exit 1
            fi
            aarch64-elf-gcc --version | head -n1

            AR_BIN="$(pick_tool llvm-ar)"
            NM_BIN="$(pick_tool llvm-nm)"
            OBJDUMP_BIN="$(pick_tool llvm-objdump)"
            OBJCOPY_BIN="$(pick_tool llvm-objcopy)"
            SIZE_BIN="$(pick_tool llvm-size)"
            STRIP_BIN="$(pick_tool llvm-strip)"
            LD_BIN="${TC}/gcc64/bin/aarch64-elf-ld.lld"
            "${LD_BIN}" --version >/dev/null 2>&1 || LD_BIN="$(pick_tool ld.lld)"
            echo "ar=${AR_BIN} nm=${NM_BIN} objdump=${OBJDUMP_BIN}"
            echo "objcopy=${OBJCOPY_BIN} size=${SIZE_BIN} strip=${STRIP_BIN}"
            echo "ld=${LD_BIN} ($("${LD_BIN}" --version | head -n1))"

            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-elf-
              CROSS_COMPILE_ARM32=arm-eabi-
              LD="${LD_BIN}"
              AR="${AR_BIN}"
              NM="${NM_BIN}"
              OBJDUMP="${OBJDUMP_BIN}"
              OBJCOPY="${OBJCOPY_BIN}"
              OBJSIZE="${SIZE_BIN}"
              STRIP="${STRIP_BIN}"
              HOSTAR="${AR_BIN}"
              HOSTCC=gcc
              HOSTCXX=g++
              CC=aarch64-elf-gcc
            )
          else
            export PATH="${TC}/proton-clang/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
              CLANG_TRIPLE=aarch64-linux-gnu-
              LD=ld.lld
              AR=llvm-ar
              AS=llvm-as
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CC=clang
            )
          fi

          make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          if [ "${COMPILER}" = "clang" ]; then
            command -v arm-linux-gnueabi-elfedit || echo "arm-linux-gnueabi-elfedit not found in PATH"
            # Safety net: "prepare" builds the 32-bit vDSO headers (where the '-EL' error happens).
            # If it fails, switch the 32-bit vDSO off, regenerate the config and carry on.
            if ! make -j"${PROCS}" "${MAKE_ARGS[@]}" prepare; then
              echo "WARNING: prepare failed - disabling CONFIG_COMPAT_VDSO and regenerating the config"
              ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -d COMPAT_VDSO
              rm -rf out
              make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}"
              VDSO32_FIX="disable"
            fi
            grep -n "VDSO" out/.config || true
            if [ "${VDSO32_FIX}" = "disable" ] && grep -q "^CONFIG_COMPAT_VDSO=y" out/.config; then
              echo "ERROR: CONFIG_COMPAT_VDSO is still enabled - Proton Clang cannot build the 32-bit vDSO. Use compiler=gcc."
              exit 1
            fi
          fi

          if [ "${KSU_VARIANT}" != "none" ]; then
            echo "----- KernelSU related options in .config -----"
            grep -E "^CONFIG_(KSU|KPROBES)" out/.config || true
            grep -E "^CONFIG_KSU=y" out/.config || { echo "ERROR: CONFIG_KSU is not enabled"; exit 1; }
            grep -E "^CONFIG_KPROBES=y" out/.config || { echo "ERROR: CONFIG_KPROBES is not enabled"; exit 1; }
          fi

          # Same targets the NetErnels maintainer uses (Image + dtbo.img)
          if ! make -j"${PROCS}" "${MAKE_ARGS[@]}" Image dtbo.img; then
            set +e
            echo "===== BUILD FAILED - re-running with --keep-going to collect every real error ====="
            make -k -j"${PROCS}" -Otarget "${MAKE_ARGS[@]}" Image dtbo.img > "${GITHUB_WORKSPACE}/rerun.log" 2>&1
            cat "${GITHUB_WORKSPACE}/rerun.log" >> "${GITHUB_WORKSPACE}/build.log"
            # "write on a pipe with no reader" is harmless noise (llvm-objdump | grep -q) - hide it
            grep -v "write on a pipe with no reader" "${GITHUB_WORKSPACE}/rerun.log" > "${GITHUB_WORKSPACE}/rerun.clean.log"
            echo "----- first real error with surrounding lines -----"
            grep -n -m1 -B15 -A15 -E "error:|\*\*\* \[|Error [0-9]+$|undefined reference|multiple definition" "${GITHUB_WORKSPACE}/rerun.clean.log"
            echo "----- all real error lines (first 40) -----"
            grep -nE "error:|\*\*\* \[|multiple definition|undefined reference|No such file" "${GITHUB_WORKSPACE}/rerun.clean.log" | head -n 40
            exit 1
          fi

          DTB="out/arch/arm64/boot/dts/qcom/sm6150.dtb"
          [ -f "${DTB}" ] || make -j"${PROCS}" "${MAKE_ARGS[@]}" dtbs

          [ -f out/arch/arm64/boot/Image ] || { echo "ERROR: Image was not built"; exit 1; }
          [ -f out/arch/arm64/boot/dtbo.img ] || { echo "ERROR: dtbo.img was not built"; exit 1; }
          [ -f "${DTB}" ] || { echo "ERROR: ${DTB} was not built"; find out -name 'sm6150*.dtb'; exit 1; }

      # ------------------------------------------------------------
      - name: Package (AnyKernel3)
        shell: bash
        run: |
          set -e
          KOUT="${GITHUB_WORKSPACE}/kernel-source/out/arch/arm64/boot"

          # NetErnels' own AnyKernel3 (device-specific), same as the maintainer's kramel.sh
          git clone --depth=1 -b mojito https://github.com/neternels/anykernel3 anykernel3-mojito
          cp "${KOUT}/Image" anykernel3-mojito/
          cp "${KOUT}/dtbo.img" anykernel3-mojito/
          cat "${KOUT}/dts/qcom/sm6150.dtb" > anykernel3-mojito/dtb

          TAG=""
          case "${KSU_VARIANT}" in
            next-legacy)     TAG="-KSUNext" ;;
            official-v0.9.5) TAG="-KSU" ;;
          esac
          ZIP="NetErnels-mojito${TAG}-$(date +%Y%m%d)-${KERNEL_COMMIT}.zip"

          cd anykernel3-mojito
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP}" . -x ".git*" -x "README.md" -x "LICENSE" -x "*.zip"
          cd "${GITHUB_WORKSPACE}"
          ls -lh "${ZIP}"
          sha1sum "${ZIP}"

      # ------------------------------------------------------------
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: NetErnels-mojito-KSU
          if-no-files-found: error
          path: NetErnels-mojito*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          if-no-files-found: ignore
          path: build.log
