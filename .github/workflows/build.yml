name: Build NetErnels (mojito/sunny) with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo"
        required: true
        default: "https://github.com/Neternels/android_kernel_xiaomi_sunny"
      kernel_branch:
        description: "Kernel branch (leave empty = repo default branch). Check the 'Show kernel branches' step to pick the newest one"
        required: false
        default: "LA.UM.9.1"
      defconfig:
        description: "Defconfig name"
        required: true
        default: "neternels_defconfig"
      runner:
        description: "Runner OS (use ubuntu-24.04 if a toolchain tool complains about GLIBC)"
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
        default: ubuntu-22.04
      compiler:
        description: "Compiler (if the build fails with one, try the other)"
        required: true
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      ksu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - next-legacy
          - official-v0.9.5
          - none
        default: next-legacy
      ksu_ref:
        description: "KernelSU-Next ref: 'legacy' = latest on the legacy (non-GKI) branch, or a tag/commit to pin"
        required: false
        default: "legacy"
      perf_module:
        description: "Also build a KernelSU/Magisk module with performance tweaks (separate zip)"
        required: false
        type: boolean
        default: true
      read_ahead_kb:
        description: "Module: read-ahead for internal storage in KB (0 = skip)"
        required: false
        default: "512"
      top_app_boost:
        description: "Module: schedtune boost for the foreground app (0 = skip, higher = smoother but more battery)"
        required: false
        default: "10"

jobs:
  build:
    name: Build Kernel
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      COMPILER: ${{ inputs.compiler }}
      KSU_VARIANT: ${{ inputs.ksu_variant }}
      KSU_REF: ${{ inputs.ksu_ref }}
      READ_AHEAD_KB: ${{ inputs.read_ahead_kb }}
      TOP_APP_BOOST: ${{ inputs.top_app_boost }}
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions
      DEBIAN_FRONTEND: noninteractive

    # NOTE: every step below starts with
    #   exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
    # so the whole job output (not only the make output) ends up in the build.log artifact,
    # even when a step fails before "make" starts.

    steps:
      # ------------------------------------------------------------
      - name: Show kernel branches (newest first)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          REPO="${KERNEL_REPO#https://github.com/}"
          REPO="${REPO%.git}"
          echo "Branches of ${REPO}, newest commit first:"
          gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name' | head -n 40 | while read -r b; do
            d="$(gh api "repos/${REPO}/commits/${b}" --jq '.commit.committer.date' 2>/dev/null)"
            echo "${d}  ${b}"
          done | sort -r | head -n 20
          exit 0

      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            perl \
            python-is-python3 \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip \
            zlib1g-dev

          # This 4.14 kernel builds dtbo.img with "python2" (error was: /bin/sh: python2: not found)
          sudo apt-get install -y python2 || true
          if ! command -v python2 >/dev/null 2>&1; then
            echo "python2 package not available - linking python3 as python2"
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python2
          fi
          python2 --version

      # ------------------------------------------------------------
      - name: Check LLVM tools
        shell: bash
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -e
          for t in ar nm objdump objcopy strip as size; do
            if ! command -v "llvm-$t" >/dev/null 2>&1; then
              V="$(ls /usr/bin/llvm-$t-* 2>/dev/null | sort -V | tail -n1)"
              if [ -n "$V" ]; then
                sudo ln -sf "$V" "/usr/local/bin/llvm-$t"
                echo "linked llvm-$t -> $V"
              else
                echo "ERROR: llvm-$t not found"
                exit 1
              fi
            fi
          done
          if ! command -v ld.lld >/dev/null 2>&1; then
            V="$(ls /usr/bin/ld.lld-* 2>/dev/null | sort -V | tail -n1)"
            if [ -n "$V" ]; then
              sudo ln -sf "$V" /usr/local/bin/ld.lld
              echo "linked ld.lld -> $V"
            else
              echo "ERROR: ld.lld not found"
              exit 1
            fi
          fi
          ld.lld --version | head -n1
          echo "LLVM tools OK"

      # ------------------------------------------------------------
      - name: Clone kernel source (latest)
        shell: bash
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -e

          for i in 1 2 3; do
            if [ -n "${KERNEL_BRANCH}" ]; then
              git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel-source && break
            else
              git clone --depth=1 "${KERNEL_REPO}" kernel-source && break
            fi
            echo "Clone attempt $i failed, retrying..."
            rm -rf kernel-source
            sleep 10
          done

          [ -d kernel-source/.git ] || { echo "ERROR: could not clone ${KERNEL_REPO} (branch: ${KERNEL_BRANCH})"; exit 1; }

          cd kernel-source

          echo "Repo    : ${KERNEL_REPO}"
          echo "Branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit  : $(git log -1 --format='%h  %cd  %s' --date=short)"
          echo "Kernel  : $(make kernelversion 2>/dev/null || true)"

          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "ERROR: defconfig '${DEFCONFIG}' not found. Available configs:"
            ls arch/arm64/configs | head -n 60
            exit 1
          fi

      # ------------------------------------------------------------
      - name: Download toolchain
        shell: bash
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -e

          # git clone (instead of a branch tarball) so it works whatever the default branch is called
          clone_tc() {
            local url="$1" dir="$2" i
            for i in 1 2 3; do
              rm -rf "${dir}"
              if git clone --depth=1 "${url}" "${dir}"; then
                return 0
              fi
              echo "Clone of ${url} failed (attempt ${i}), retrying..."
              sleep 10
            done
            echo "ERROR: could not clone ${url}"
            return 1
          }

          if [ "${COMPILER}" = "gcc" ]; then
            clone_tc "https://github.com/cyberknight777/gcc-arm64" gcc64
            clone_tc "https://github.com/cyberknight777/gcc-arm" gcc32

            ./gcc64/bin/aarch64-elf-gcc --version | head -n1 || echo "WARNING: aarch64-elf-gcc cannot run here (GLIBC?) - try runner=ubuntu-24.04"

            echo "---- toolchain sanity check (does each tool run on this runner?) ----"
            for t in gcc64/bin/aarch64-elf-gcc gcc64/bin/aarch64-elf-as gcc64/bin/aarch64-elf-ld \
                     gcc64/bin/aarch64-elf-ld.lld gcc32/bin/arm-eabi-gcc gcc32/bin/arm-eabi-as \
                     gcc32/bin/arm-eabi-ld; do
              if [ -x "$t" ]; then
                if "$t" --version > /tmp/ver.txt 2>&1; then
                  echo "OK    $t : $(head -n1 /tmp/ver.txt)"
                else
                  echo "FAIL  $t : $(head -n1 /tmp/ver.txt)"
                fi
              else
                echo "MISS  $t"
              fi
            done
          else
            curl -fsSL --retry 5 --retry-delay 5 -o proton.tar.gz \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
            tar -xzf proton.tar.gz
            mv proton-clang-master proton-clang
            rm -f proton.tar.gz
            ./proton-clang/bin/clang --version | head -n1
          fi

      # ------------------------------------------------------------
      - name: Integrate KernelSU
        if: ${{ inputs.ksu_variant != 'none' }}
        shell: bash
        working-directory: kernel-source
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -eo pipefail

          if [ "${KSU_VARIANT}" = "next-legacy" ]; then
            # KernelSU-Next: the actively maintained fork that still supports non-GKI (4.14) kernels
            SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
            SETUP_ARG="${KSU_REF:-legacy}"
          else
            # Official KernelSU: v0.9.5 is the last release that supports non-GKI kernels
            SETUP_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
            SETUP_ARG="v0.9.5"
          fi

          echo "KernelSU variant: ${KSU_VARIANT}  (ref: ${SETUP_ARG})"

          # download first (with retries), then run - a failed download can no longer be hidden by the pipe
          curl -fLSs --retry 5 --retry-delay 5 -o /tmp/ksu_setup.sh "${SETUP_URL}"
          bash /tmp/ksu_setup.sh "${SETUP_ARG}"

          # Make sure the hook-up really happened (folder name differs between variants)
          if [ ! -e drivers/kernelsu ] && ! ls -d KernelSU* >/dev/null 2>&1; then
            echo "ERROR: KernelSU was not added to the kernel tree"
            exit 1
          fi
          grep -qi kernelsu drivers/Makefile || { echo "ERROR: drivers/Makefile was not patched"; exit 1; }
          grep -qi kernelsu drivers/Kconfig  || { echo "ERROR: drivers/Kconfig was not patched"; exit 1; }

          for d in KernelSU KernelSU-Next; do
            if [ -d "$d" ]; then
              echo "Integrated ${d}: branch '$(git -C "$d" rev-parse --abbrev-ref HEAD 2>/dev/null)'  $(git -C "$d" log -1 --format='%h  %cd  %s' --date=short 2>/dev/null)"
            fi
          done

          # Kprobe based hooks (works on kernels with working kprobes)
          ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS

          grep -E "CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=" "arch/arm64/configs/${DEFCONFIG}"

      # ------------------------------------------------------------
      - name: Clang workaround - 32-bit vDSO assembler
        if: ${{ inputs.compiler == 'clang' }}
        shell: bash
        working-directory: kernel-source
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -e

          # Known issue with 4.14 kernels + newer clang:
          #   proton-clang/bin/as: unrecognized option '-EL'
          # clang looks for a plain "as" inside the toolchain dir and finds the x86 one.
          # Upstream fix: arm64: vdso32: Fix '--prefix=' value for newer versions of clang.
          MK=arch/arm64/kernel/vdso32/Makefile

          echo "----- current --prefix lines in ${MK} -----"
          grep -n -- "--prefix=\|elfedit" "$MK" || true

          cat > /tmp/patch_vdso32.py <<'PY_EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          m = re.search(r'which \$\((CROSS_COMPILE_[A-Z0-9_]+)\)elfedit', s)
          old = '--prefix=$(COMPAT_GCC_TOOLCHAIN_DIR)'
          if not m or old not in s:
              print('pattern not found'); sys.exit(3)
          if old + '$(notdir' in s:
              print('already patched'); sys.exit(0)
          var = m.group(1)
          s = s.replace(old, old + '$(notdir $(' + var + '))')
          open(p, 'w').write(s)
          print('patched using', var)
          PY_EOF

          FIX="disable"
          if [ -f "$MK" ] && python3 /tmp/patch_vdso32.py "$MK"; then
            FIX="patch"
            echo "----- after patch -----"
            grep -n -- "--prefix=" "$MK"
          fi

          if [ "$FIX" = "disable" ]; then
            echo "Could not patch the vdso32 Makefile - disabling the 32-bit vDSO instead"
            echo "vDSO related symbols in arch/arm64/Kconfig:"
            grep -n "VDSO" arch/arm64/Kconfig || true
            if grep -q "COMPAT_VDSO" arch/arm64/Kconfig; then
              ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -d COMPAT_VDSO
              grep -n "COMPAT_VDSO" "arch/arm64/configs/${DEFCONFIG}" || true
            else
              echo "WARNING: COMPAT_VDSO symbol not found - the 32-bit vDSO may still fail with clang."
            fi
          fi

          echo "VDSO32_FIX=${FIX}" >> "$GITHUB_ENV"
          echo "vDSO32 fix mode: ${FIX}"

      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        working-directory: kernel-source
        run: |
          exec > >(tee -a "${GITHUB_WORKSPACE}/build.log") 2>&1
          set -eo pipefail

          TC="${GITHUB_WORKSPACE}"
          PROCS="$(nproc --all)"

          if [ "${COMPILER}" = "gcc" ]; then
            export PATH="${TC}/gcc32/bin:${TC}/gcc64/bin:/usr/bin:${PATH}"

            # Is the toolchain gcc itself runnable here? (it can need a newer glibc than the runner has)
            if ! aarch64-elf-gcc --version >/dev/null 2>&1; then
              echo "ERROR: aarch64-elf-gcc cannot run on this runner (probably GLIBC). Re-run with runner=ubuntu-24.04."
              aarch64-elf-gcc --version || true
              exit 1
            fi
            aarch64-elf-gcc --version | head -n1

            # The toolchain's own lld may need a newer glibc than this runner has
            # (error: version `GLIBC_2.36' not found). Fall back to a working system ld.lld.
            # NOTE: PATH starts with the toolchain dirs, so never use "command -v ld.lld" here -
            # it could return the broken toolchain copy. Look at the system locations explicitly.
            pick_system_lld() {
              local c
              for c in /usr/local/bin/ld.lld /usr/bin/ld.lld $(ls /usr/bin/ld.lld-* 2>/dev/null | sort -V -r); do
                if [ -x "$c" ] && "$c" --version >/dev/null 2>&1; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }

            LD_BIN="${TC}/gcc64/bin/aarch64-elf-ld.lld"
            if ! "${LD_BIN}" --version >/dev/null 2>&1; then
              echo "Toolchain ld.lld cannot run on this runner - using the system ld.lld instead"
              LD_BIN="$(pick_system_lld)" || { echo "ERROR: no working ld.lld found on this runner"; exit 1; }
            fi
            echo "Linker: ${LD_BIN}"
            "${LD_BIN}" --version | head -n1

            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-elf-
              CROSS_COMPILE_ARM32=arm-eabi-
              LD="${LD_BIN}"
              AR=llvm-ar
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              OBJCOPY=llvm-objcopy
              OBJSIZE=llvm-size
              STRIP=llvm-strip
              HOSTAR=llvm-ar
              HOSTCC=gcc
              HOSTCXX=g++
              CC=aarch64-elf-gcc
            )
          else
            export PATH="${TC}/proton-clang/bin:/usr/bin:${PATH}"
            MAKE_ARGS=(
              ARCH=arm64
              O=out
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
              CLANG_TRIPLE=aarch64-linux-gnu-
              LD=ld.lld
              AR=llvm-ar
              AS=llvm-as
              NM=llvm-nm
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CC=clang
            )
          fi

          make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          if [ "${COMPILER}" = "clang" ]; then
            echo "----- clang diagnostics -----"
            command -v arm-linux-gnueabi-elfedit || echo "arm-linux-gnueabi-elfedit not found in PATH"
            ls "${TC}/proton-clang/bin" | grep -E '^arm-linux-gnueabi-(as|ld)$' || true

            # Safety net: run the "prepare" stage first - it is the one that builds the 32-bit vDSO
            # headers (where the '-EL' assembler error happens). If it fails for any reason, switch the
            # 32-bit vDSO off and regenerate the config so the build can still finish.
            echo "----- pre-flight: prepare stage (32-bit vDSO) -----"
            if ! make -j"${PROCS}" "${MAKE_ARGS[@]}" prepare; then
              echo "WARNING: prepare failed - disabling CONFIG_COMPAT_VDSO and regenerating the config"
              ./scripts/config --file "arch/arm64/configs/${DEFCONFIG}" -d COMPAT_VDSO
              rm -rf out
              make -j"${PROCS}" "${MAKE_ARGS[@]}" "${DEFCONFIG}"
              VDSO32_FIX="disable"
            fi

            echo "----- vDSO options in .config (fix mode: ${VDSO32_FIX:-none}) -----"
            grep -n "VDSO" out/.config || true
            if [ "${VDSO32_FIX}" = "disable" ] && grep -q "^CONFIG_COMPAT_VDSO=y" out/.config; then
              echo "ERROR: CONFIG_COMPAT_VDSO is still enabled - Proton Clang cannot build the 32-bit vDSO. Use compiler=gcc."
              exit 1
            fi
          fi

          if [ "${KSU_VARIANT}" != "none" ]; then
            echo "----- KernelSU related options in .config -----"
            grep -E "^CONFIG_(KSU|KPROBES)" out/.config || true
            grep -E "^CONFIG_KSU=y" out/.config \
              || { echo "ERROR: CONFIG_KSU is not enabled"; grep -i ksu out/.config; exit 1; }
            grep -E "^CONFIG_KPROBES=y" out/.config \
              || { echo "ERROR: CONFIG_KPROBES is not enabled"; grep -i kprobe out/.config; exit 1; }
          fi

          # Same targets the NetErnels maintainer uses (Image + dtbo.img)
          if ! make -j"${PROCS}" "${MAKE_ARGS[@]}" Image dtbo.img; then
            set +e
            echo "=============================================================="
            echo " BUILD FAILED - re-running with --keep-going to collect every real error"
            echo "=============================================================="
            make -k -j"${PROCS}" -Otarget "${MAKE_ARGS[@]}" Image dtbo.img > "${GITHUB_WORKSPACE}/rerun.log" 2>&1
            cat "${GITHUB_WORKSPACE}/rerun.log" >> "${GITHUB_WORKSPACE}/build.log"

            echo "----- first error with surrounding lines -----"
            grep -n -m1 -B12 -A12 -E "error:|\*\*\* \[|Error [0-9]+$" "${GITHUB_WORKSPACE}/